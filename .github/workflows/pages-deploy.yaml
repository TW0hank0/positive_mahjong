# this workflow was changed to commit-ci.yaml

name: pages-deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Dep
        uses: ./.github/workflows/instdep/

      - name: Build license
        run: |
          cd scripts
          uv run build_license.py
          cd ..

      - name: Copy webiste dep
        run: |
          cd scripts
          uv run copy_website_dep.py
          cd ..

      - name: Build doc and website
        run: |
          cd scripts
          uv run build_website.py
          cd ..

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./website_build/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1
