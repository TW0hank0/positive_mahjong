name: commit-ci

"on":
  # 支援在 GitHub 上手動點擊觸發
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  make-cache:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Dep
        uses: ./.github/workflows/instdep

      - name: Save Cache Cargo installed tools on Linux
        uses: actions/cache/save@v6
        if: "${{ inputs.save-cache }} == 'true' && runner.os == 'Linux' && steps.cache-cargo-tools-linux.outputs.cache-hit != 'true'"
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-about
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/cargo-msrv
            ~/.cargo/bin/taplo
            ~/.cargo/bin/eza
            ~/.cargo/bin/wild
          key: ${{ runner.os }}-cargo-tools-${{ hashFiles('.github/cache-version.json') }}

      - name: Save Cache Cargo installed tools on Windows
        uses: actions/cache/save@v6
        if: "${{ inputs.save-cache }} == 'true' && runner.os == 'Windows' && steps.cache-cargo-tools-windows.outputs.cache-hit != 'true'"
        with:
          path: |
            ~/.cargo/bin/cargo-deny.exe
            ~/.cargo/bin/cargo-about.exe
            ~/.cargo/bin/mdbook.exe
            ~/.cargo/bin/cargo-msrv.exe
            ~/.cargo/bin/taplo.exe
            ~/.cargo/bin/eza.exe
            key: ${{ runner.os }}-cargo-tools-${{ hashFiles('.github/cache-version.json') }}

  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Dep
        uses: ./.github/workflows/instdep

      - name: Prepare venv
        run: |
          cd scripts
          uv venv
          uv sync
          cd ..

      - name: Run debug check
        run: cargo check --workspace

      - name: Run release check
        run: cargo check --release --workspace

      - name: Run clippy
        run: cargo clippy

      - name: Run License Check
        run: |
          cd scripts
          uv run license_check.py
          cd ..

      - name: Lint toml file
        run: taplo lint

      - name: ruff check scripts
        run: |
          cd scripts
          ruff check .
          cd ..

      - name: ty check scripts
        run: |
          cd scripts
          ty check .
          cd ..

      # comment cause by:
      #  cargo-msrv never run sucessful when rust-toolchain is nightly
      # - name: Run util msrv script
      #   run: |
      #     cd scripts
      #     uv run util.py msrv
      #     cd ..

      - name: Run cargo-deny
        run: |
          cargo deny fetch
          cargo deny check

  build_client_desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - uses: ./.github/workflows/instdep

      - name: Prepare venv
        run: |
          cd scripts
          uv venv
          uv sync
          cd ..

      - name: use build script
        env:
          CARGO_BUILD_JOBS: 1 # 限制為單線程，避免 OOM Killer
        run: |
          cd scripts
          uv run build_desktop.py
          cd ..

      - name: get version on Linux
        id: get_version_linux
        if: runner.os == 'Linux'
        run: |
          cd scripts
          file=$(uv run util.py get_version)
          echo "version=$file" >> $GITHUB_OUTPUT
          cd ..

      - name: get version on Windows
        id: get_version_windows
        if: runner.os == 'Windows'
        run: |
          cd scripts
          $file = (uv run util.py get_version)
          echo "version=$file" >> $env:GITHUB_OUTPUT
          cd ..

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: artifacts
          path: artifacts

