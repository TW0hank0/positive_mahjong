  release_artifacts:
    needs:
      - build_client_desktop
      #- build_android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout code
        uses: actions/checkout@v7.0.1

      - uses: ./.github/workflows/instdep

      - name: prepare CI Venv
        run: |
          cd scripts
          uv venv
          uv sync
          cd ..

      - name: download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: List Dir
        run: |
          eza --tree .

      - name: release and upload artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Github Action Token
          CODEBERG_PAT_TOKEN: ${{ secrets.CODEBERG_PAT_TOKEN }} # PAT
          GITLAB_PAT_TOKEN: ${{ secrets.GL_PAT }} # PAT
        run: |
          cd scripts
          uv run releases.py
          cd ..

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - uses: ./.github/workflows/instdep/

      - name: Build license
        run: |
          cd scripts
          uv run build_license.py
          cd ..

      - name: Build doc and website
        run: |
          cd scripts
          uv run build_website.py
          cd ..

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./website_build/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1

  deploy_with_artifacts:
    needs:
      - build_client_desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - uses: ./.github/workflows/instdep/

      - name: download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Build license
        run: |
          cd scripts
          uv run build_license.py
          cd ..

      - name: Build doc and website
        run: |
          cd scripts
          uv run build_website.py
          cd ..

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./website_build/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1
