name: commit-ci

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Dep
        uses: ./.github/workflows/instdep

      - name: Prepare venv
        run: |
          cd scripts
          uv venv
          uv sync
          cd ..

      - name: Run debug check
        run: cargo check --workspace

      - name: Run release check
        run: cargo check --release --workspace

      - name: Run clippy
        run: cargo clippy

      - name: Run License Check
        run: |
          cd scripts
          uv run license_check.py
          cd ..

      - name: Lint toml file
        run: taplo lint

      - name: install ruff and ty
        run: |
          uv tool install ruff ty

      - name: check scripts
        run: |
          cd scripts
          ruff check .
          ty check .
          cd ..

      - name: Run cargo-msrv script
        run: |
          cd scripts
          uv run cargo_msrv.py
          cd ..

      - name: Run cargo-deny
        run: |
          cargo deny fetch
          cargo deny check

  build_client_desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install Dep
        uses: ./.github/workflows/instdep

      - name: Prepare venv
        run: |
          cd scripts
          uv venv
          uv sync
          cd ..

      - name: use build script
        run: |
          cd scripts
          uv run build_desktop.py
          cd ..

      - name: get version on Linux
        id: get_version_linux
        if: runner.os == 'Linux'
        run: |
          cd scripts
          file=$(uv run util.py get_version)
          echo "version=$file" >> $GITHUB_OUTPUT
          cd ..

      - name: get version on Windows
        id: get_version_windows
        if: runner.os == 'Windows'
        run: |
          cd scripts
          $file = (uv run util.py get_version)
          echo "version=$file" >> $env:GITHUB_OUTPUT
          cd ..

      - name: Upload desktop artifact on Linux
        uses: actions/upload-artifact@v7.0.1
        if: runner.os == 'Linux'
        with:
          name: positive_mahjong-desktop-v${{ steps.get_version_linux.outputs.version }}-linux.zip
          path: positive_mahjong-desktop-v${{ steps.get_version_linux.outputs.version }}-linux.zip

      - name: Upload desktop artifact on Windows
        uses: actions/upload-artifact@v7.0.1
        if: runner.os == 'Windows'
        with:
          name: positive_mahjong-desktop-v${{ steps.get_version_windows.outputs.version }}-windows.zip
          path: positive_mahjong-desktop-v${{ steps.get_version_windows.outputs.version }}-windows.zip

