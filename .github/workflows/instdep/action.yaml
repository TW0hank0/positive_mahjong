name: Install Dep

description: Install dep that workflows need

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1

    - name: check uv install and install cpython
      shell: pwsh
      run: |
        uv self version
        uv python install cpython-3.14

    - name: install rustup on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://win.rustup.rs" -OutFile "rustup-init.exe"
        ls
        .\rustup-init.exe -y

    - name: install rustup on Linux
      shell: pwsh
      if: runner.os == 'Linux'
      run: |
        curl https://sh.rustup.rs -o rust-init.sh
        sh rust-init.sh -y
        rustup target add x86_64-unknown-linux-musl

    - name: check rust Install
      shell: pwsh
      run: |
        rustup --version
        rustc --version
        cargo --version

    - name: install Linux build needed dep
      shell: pwsh
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install libfontconfig1-dev pkg-config mold gcc eza -y

    - name: install go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: "stable"

    - name: use go to install addlicense tool
      shell: pwsh
      run: |
        go install github.com/google/addlicense@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Cache Cargo installed tools
      uses: actions/cache@v6
      id: cache-cargo-tools
      with:
        path: |
          ~/.cargo/bin/cargo-deny
          ~/.cargo/bin/cargo-about
          ~/.cargo/bin/mdbook
          ~/.cargo/bin/cargo-msrv
          ~/.cargo/bin/taplo
        key: ${{ runner.os }}-cargo-tools-${{ hashFiles('.github/cache-version.txt') }}

    - name: Install cargo tools if not cached
      shell: pwsh
      if: steps.cache-cargo-tools.outputs.cache-hit != 'true'
      run: |
        cargo install cargo-msrv cargo-deny taplo-cli mdbook --locked
        cargo install cargo-about --features="cli" --locked

    - name: check tools installion
      shell: pwsh
      run: |
        cargo about --version
        cargo msrv --version
        cargo deny --version
        taplo --version
        mdbook --version

    - name: install ruff and ty using uv
      shell: pwsh
      run: |
        uv tool install ruff
        uv tool install ty

