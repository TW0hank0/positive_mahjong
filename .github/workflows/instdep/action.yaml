name: Install Dep

description: Install dep that workflows need
input:
  save-cache:
    default: "false"
    required: false
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0

    - name: check uv install and install cpython
      shell: pwsh
      run: |
        uv self version
        uv python install cpython-3.14

    - name: install rustup on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://win.rustup.rs" -OutFile "rustup-init.exe"
        ls
        .\rustup-init.exe -y

    - name: install rustup on Linux
      shell: pwsh
      if: runner.os == 'Linux'
      run: |
        curl https://sh.rustup.rs -o rust-init.sh
        sh rust-init.sh -y
        rustup target add x86_64-unknown-linux-musl

    - name: check rust Install
      shell: pwsh
      run: |
        rustup --version
        rustc --version
        cargo --version

    - name: install Linux build needed dep
      shell: pwsh
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev pkg-config mold gcc

    - name: install Windows needed dep
      shell: pwsh
      if: runner.os == 'Windows'
      run: |
        winget install --id LLVM.LLVM --accept-source-agreements --accept-package-agreements

    - name: install go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: "stable"
        cache: false

    - name: use go to install addlicense tool
      shell: pwsh
      run: |
        go install github.com/google/addlicense@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Cache Cargo installed tools on Linux
      uses: actions/cache/restore@v5
      id: cache-cargo-tools-linux
      if: runner.os == 'Linux'
      with:
        path: |
          ~/.cargo/bin/cargo-deny
          ~/.cargo/bin/cargo-about
          ~/.cargo/bin/mdbook
          ~/.cargo/bin/cargo-msrv
          ~/.cargo/bin/taplo
          ~/.cargo/bin/eza
          ~/.cargo/bin/wild
        key: ${{ runner.os }}-cargo-tools-${{ hashFiles('.github/cache-version.json') }}

    - name: Cache Cargo installed tools on Windows
      uses: actions/cache/restore@v5
      id: cache-cargo-tools-windows
      if: runner.os == 'Windows'
      with:
        path: |
          ~/.cargo/bin/cargo-deny.exe
          ~/.cargo/bin/cargo-about.exe
          ~/.cargo/bin/mdbook.exe
          ~/.cargo/bin/cargo-msrv.exe
          ~/.cargo/bin/taplo.exe
          ~/.cargo/bin/eza.exe
        key: ${{ runner.os }}-cargo-tools-${{ hashFiles('.github/cache-version.json') }}

    - name: Install cargo tools if not cached on Linux
      shell: pwsh
      if: steps.cache-cargo-tools-linux.outputs.cache-hit != 'true' && runner.os == 'Linux'
      run: |
        cargo +stable install --locked cargo-msrv cargo-deny taplo-cli mdbook eza wild-linker
        cargo +stable install --locked cargo-about --features="cli"

    - name: Install cargo tools if not cached on Windows
      shell: pwsh
      if: steps.cache-cargo-tools-windows.outputs.cache-hit != 'true' && runner.os == 'Windows'
      run: |
        cargo +stable install --locked cargo-msrv cargo-deny taplo-cli mdbook eza
        cargo +stable install --locked cargo-about --features="cli"

    - name: check tools installion
      shell: pwsh
      run: |
        cargo about --version
        cargo msrv --version
        cargo deny --version
        taplo --version
        mdbook --version
        eza --version

    - name: install ruff and ty using uv
      shell: pwsh
      run: |
        uv tool install ruff
        uv tool install ty

    - name: list files with pwsh
      shell: pwsh
      run: |
        Get-ChildItem . -Recurse

    - name: list files with eza
      shell: pwsh
      run: |
        eza --tree .

    # - name: install java
    #   uses: actions/setup-java@v5.7.0
    #   with:
    #     distribution: "temurin" # See 'Supported distributions' for available options
    #     java-version: "21"

    # - name: Setup Android
    #   uses: android-actions/setup-android@v4.0.1

    - name: Save Cache Cargo installed tools on Linux
      uses: actions/cache/save@v5
      id: cache-cargo-tools-linux
      if: "${{ inputs.save-cache }} == 'true' && runner.os == 'Linux' && steps.cache-cargo-tools-linux.outputs.cache-hit != 'true'"
      with:
        path: |
          ~/.cargo/bin/cargo-deny
          ~/.cargo/bin/cargo-about
          ~/.cargo/bin/mdbook
          ~/.cargo/bin/cargo-msrv
          ~/.cargo/bin/taplo
          ~/.cargo/bin/eza
          ~/.cargo/bin/wild
        key: ${{ runner.os }}-cargo-tools-${{ hashFiles('.github/cache-version.json') }}

    - name: Save Cache Cargo installed tools on Windows
      uses: actions/cache/save@v5
      id: cache-cargo-tools-windows
      if: "${{ inputs.save-cache }} == 'true' && runner.os == 'Windows' && steps.cache-cargo-tools-windows.outputs.cache-hit != 'true'"
      with:
        path: |
          ~/.cargo/bin/cargo-deny.exe
          ~/.cargo/bin/cargo-about.exe
          ~/.cargo/bin/mdbook.exe
          ~/.cargo/bin/cargo-msrv.exe
          ~/.cargo/bin/taplo.exe
          ~/.cargo/bin/eza.exe
        key: ${{ runner.os }}-cargo-tools-${{ hashFiles('.github/cache-version.json') }}
