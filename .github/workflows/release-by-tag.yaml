name: release-by-tag

on:
  push:
    branches:
      - master

jobs:
  release-by-tag:
    # needs:
    #   - build_computer
    #   - build_android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Prepare CI Venv
        run: |
          cd scripts
          uv venv
          uv sync
          cd ..

      - name: List Dir (for debug)
        run: |
          ls .

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run scripts/release_gh.py
