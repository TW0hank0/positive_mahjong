name: Install Dep
description: Install dep that workflows need
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

    - name: Remove Snap
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo systemctl stop snapd.service
        sudo apt-get purge -y snapd
        # sudo rm -rf ~/snap /snap /var/snap /var/lib/snapd /etc/snapd

    - name: install Linux build needed dep
      shell: bash
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get upgrade -y
        sudo apt-get install -y libfontconfig1-dev pkg-config gcc musl-tools clang

    - uses: rui314/setup-mold
      with:
        make-default: false

    - name: check uv install and install cpython
      shell: bash
      run: |
        uv self version
        uv python install cpython-3.15

    - name: install rustup on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://win.rustup.rs" -OutFile "rustup-init.exe"
        ls
        .\rustup-init.exe -y

    - name: install rustup on Linux
      shell: bash
      if: runner.os == 'Linux'
      run: |
        curl https://sh.rustup.rs -o rustup-init.sh
        sh rustup-init.sh -y
        . "$HOME/.cargo/env"

    - name: Rustup update
      shell: bash
      run: |
        rustup set auto-install enable
        rustup update

    - name: check rust Install
      shell: bash
      run: |
        rustup --version
        rustc --version
        cargo --version

    - run: rustup component add rustc-codegen-cranelift
      shell: bash
      if: runner.os == 'Linux'

    - name: install go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: stable
        cache: false
    - name: use go to install addlicense tool
      shell: bash
      run: |
        go install github.com/google/addlicense@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Exclude Workspace from Windows Defender
      run: |
        Add-MpPreference -ExclusionPath "${{ github.workspace }}"
        Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"
      shell: powershell
      if: runner.os == 'Windows'

    - name: Cache Cargo installed tools on Linux
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      id: cache-cargo-tools-linux
      if: runner.os == 'Linux'
      with:
        path: |
          ~/.cargo/bin/cargo-deny
          ~/.cargo/bin/cargo-about
          ~/.cargo/bin/mdbook
          ~/.cargo/bin/cargo-msrv
          ~/.cargo/bin/eza
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-tools-${{ hashFiles('ci-cache-version.json') }}
    - name: Cache Cargo installed tools on Windows
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      id: cache-cargo-tools-windows
      if: runner.os == 'Windows'
      with:
        path: |
          ~/.cargo/bin/cargo-deny.exe
          ~/.cargo/bin/cargo-about.exe
          ~/.cargo/bin/mdbook.exe
          ~/.cargo/bin/cargo-msrv.exe
          ~/.cargo/bin/eza.exe
        key: ${{ runner.os }}-${{ runner.arch}}-cargo-tools-${{ hashFiles('ci-cache-version.json') }}
    - name: Install cargo tools if not cached on Linux
      shell: bash
      if: steps.cache-cargo-tools-linux.outputs.cache-hit != 'true' && runner.os == 'Linux'
      run: |
        cargo +stable install --locked cargo-msrv cargo-deny mdbook eza
        cargo +stable install --locked cargo-about --features="cli"
    - name: Install cargo tools if not cached on Windows
      shell: bash
      if: steps.cache-cargo-tools-windows.outputs.cache-hit != 'true' && runner.os == 'Windows'
      run: |
        cargo +stable install --locked cargo-msrv cargo-deny mdbook eza
        cargo +stable install --locked cargo-about --features="cli"
    - uses: wild-linker/action
    # - name: Create soft link for wild
    #   shell: bash
    #   if: runner.os == 'Linux'
    #   run: |
    #     echo 'create link for wild'
    #     sudo ln -s ~/.cargo/bin/wild /usr/bin/ld.wild
    - name: check tools installion
      shell: bash
      run: |
        cargo about --version
        cargo msrv --version
        cargo deny --version
        mdbook --version
        eza --version
    - name: install reuse-tool, tombi, ruff and ty using uv
      shell: bash
      run: |
        uv tool install ruff
        uv tool install ty
        uv tool install reuse[charset-normalizer]
        uv tool install tombi
    - name: list files with eza
      shell: bash
      run: eza --tree .
