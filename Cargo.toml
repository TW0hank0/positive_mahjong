[workspace.package]
authors = ["TW0hank0 <public.email.hank@tutamail.com>"]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/TW0hank0/positive_mahjong"
rust-version = "1.94"
version = "0.1.0"

[workspace.dependencies]
# --- local ---
pmj_gamemodes = { path = "crates/pmj_gamemodes" }
pmj_shared = { path = "crates/pmj_shared" }
positive_mahjong = { path = "." }
# --- shared ---
godot = { version = "0.5.3", features = ["api-4-6"] }
iced = { version = "0.14.0", features = [
    "advanced",
    "canvas",
    "debug",
    "image",
    "lazy",
    "linux-theme-detection",
    "svg",
    "thread-pool",
    "tiny-skia",
    "wayland",
    "wgpu",
    "x11",
] }
image = { version = "0.25.10", features = [
    "bmp",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
local-ip-address = "0.6.10"
log = "0.4.29"
lyon_algorithms = "1.0"
rand = "0.10.2"
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0.149"
tungstenite = { version = "0.29.0", features = [
    "rustls",
    "rustls-native-certs",
] }
# --- wasm ---
console_error_panic_hook = { version = "0.1.5" }
wasm-bindgen = { version = "0.2" }
# --- android ---
android_logger = { version = "0.14.1" }

[workspace]
members = [
    "crates/pmj_client_cross/rust",
    "crates/pmj_client_desktop",
    "crates/pmj_gamemodes",
    "crates/pmj_server",
    "crates/pmj_shared",
]
resolver = "3"

[profile.release]
debug = false
lto = true
opt-level = 3

[profile.dev]
debug = 2
lto = false
