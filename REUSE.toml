version = 1

[[annotations]]
SPDX-FileCopyrightText = "2026 TW0hank0"
SPDX-License-Identifier = "AGPL-3.0-only"
path = [
    ".editorconfig",
    ".gitattributes",
    ".gitignore",
    "Cargo.lock",
    "ci-cache-version.json",
    "TODO.md",
    "CHANGELOG.md",
    "renovate.json",
    "supply-chain/*",
    "ROADMAP.md",
    "about.toml",
    "taplo.toml",
    "deny.toml",
    "rust-toolchain.toml",
    "READMEs/**",
    "Cargo.toml",
    "docs/**",
    "README.md",
    ".zed/*",
    "scripts/**",
    "templates/*",
    ".gitlab/**",
    ".gitlab-ci.yml",
    ".cargo/*",
    ".github/**",
    ".forgejo/**",
    "crates/pmj-client-core/**",
    "crates/pmj-client-cross/**",
    "crates/pmj-client-desktop/**",
    "crates/pmj-client-desktop-base/**",
    "crates/pmj-desktop/Cargo.toml",
    "crates/pmj-desktop/src/lib.rs",
    "crates/pmj-desktop/src/shared.rs",
    "crates/pmj-gamemodes/**",
    "crates/pmj-server-desktop/**",
    "crates/pmj-shared/**",
    "website/**",
    "assets/icon/*",
]
precedence = "override"

