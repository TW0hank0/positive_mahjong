[unstable]
# codegen-backend = true
profile-rustflags = true

# [profile.dev]
# # GUI is NOT able with cranelift cg-backend currently!
# #codegen-backend = "cranelift"
# codegen-backend = "llvm"
# [profile.dev.build-override]
# codegen-backend = "llvm"
# [profile.dev.package."*"]
# codegen-backend = "llvm"

[profile.release]
# use release profile cause by: let rust-analyzer work
rustflags = [
    "--remap-path-prefix",
    "~/.cargo=/.cargo",
    "--remap-path-prefix",
    "=/project",
]

# [build]
# rustflags = [
#     "--remap-path-prefix",
#     "~/.cargo=/.cargo",
#     "--remap-path-prefix",
#     "=/project",
# ]

[target.x86_64-pc-windows-msvc]
# use open-source linker
linker = "lld-link"

[target.x86_64-unknown-linux-gnu]
linker = "gcc"
# use fast linker
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# GUI is NOT able in musl env currently!
# So this target can not run sucessful :(
[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
